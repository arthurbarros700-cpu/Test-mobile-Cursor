name: Deploy Spartan Roleplay Panel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Lint & basic check ────────────────────────────────────────────────────
  check:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check server starts
        run: |
          timeout 8 node server.js &
          sleep 4
          curl -sf http://localhost:3000/api/server/status || exit 1
          echo "✅ Server health check passed"
        env:
          PORT: 3000
          JWT_SECRET: ci_test_secret_32chars_minimum_ok
          JWT_REFRESH_SECRET: ci_refresh_secret_32chars_minimum
          NODE_ENV: test

  # ── Docker build ──────────────────────────────────────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: spartan-roleplay-panel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Render (trigger webhook) ───────────────────────────────────
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [check, docker]
    if: github.ref == 'refs/heads/main' && vars.RENDER_DEPLOY_HOOK != ''
    steps:
      - name: Trigger Render deploy
        run: |
          curl -sf -X POST "${{ vars.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            --data '{}' && echo "✅ Render deploy triggered"
