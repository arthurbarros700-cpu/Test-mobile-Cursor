<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MTA Panel Bot — Demo (marketing)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #0c0d10; font-family: system-ui, sans-serif; color: #e2e8f0; }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 { font-size: 1.15rem; margin-bottom: 8px; font-weight: 700; }
    p.note { font-size: 0.88rem; color: #94a3b8; line-height: 1.5; margin-bottom: 16px; }
    .frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2d2f36;
      box-shadow: 0 12px 48px rgba(0,0,0,0.45);
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .links { margin-top: 20px; font-size: 0.9rem; }
    .links a { color: #818cf8; word-break: break-all; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Demo interativa — Painel Discord (marketing)</h1>
    <p class="note">
      A animação corre no teu browser (não é o Discord real). Em telemóvel usa em horizontal para ver o layout 16:9 completo, ou faz zoom out.
    </p>
    <div class="frame-wrap">
      <iframe
        title="Demo animada do painel"
        src="https://cdn.jsdelivr.net/gh/arthurbarros700-cpu/Test-mobile-Cursor@cursor%2Fbot-discord-mta-painel-5e30/marketing/demo/index.html"
        loading="lazy"
        allowfullscreen
      ></iframe>
    </div>
    <div class="links">
      <p><strong>Abrir em página cheia (sem moldura):</strong><br />
      <a href="https://cdn.jsdelivr.net/gh/arthurbarros700-cpu/Test-mobile-Cursor@cursor%2Fbot-discord-mta-painel-5e30/marketing/demo/index.html" target="_blank" rel="noopener">jsDelivr — demo direta</a></p>
    </div>
  </div>
</body>
</html>
