<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Spartan Roleplay — Trailer Oficial</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#03030a;color:#e8e0d0;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;}
.logo{font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.4em;color:#c9922e;margin-bottom:6px;text-align:center;}
h1{font-family:'Cinzel',serif;font-size:2rem;font-weight:900;background:linear-gradient(135deg,#c9922e,#ffd97d,#c9922e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:4px;}
.sub{color:#6a6050;font-size:.9rem;text-align:center;margin-bottom:28px;letter-spacing:.06em;}
.vwrap{width:100%;max-width:1000px;background:#060608;border:1px solid rgba(201,146,46,.25);border-radius:12px;overflow:hidden;box-shadow:0 0 80px rgba(201,146,46,.10),0 24px 64px rgba(0,0,0,.9);}
video{width:100%;display:block;}
.row{display:flex;gap:12px;margin-top:20px;justify-content:center;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:10px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;transition:.25s;}
.btn-dl{background:linear-gradient(135deg,#c9922e,#e8b44a);color:#04040a;box-shadow:0 4px 24px rgba(201,146,46,.35);}
.btn-dl:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(201,146,46,.55);}
.btn-gh{background:rgba(255,255,255,.06);border:1px solid rgba(201,146,46,.25);color:#c9922e;}
.btn-gh:hover{border-color:#c9922e;background:rgba(201,146,46,.08);}
.specs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
.spec{background:rgba(201,146,46,.06);border:1px solid rgba(201,146,46,.15);border-radius:20px;padding:5px 14px;font-size:.8rem;color:#c9922e;letter-spacing:.04em;}
.note{font-size:.75rem;color:#3a3028;text-align:center;max-width:600px;margin-top:20px;}
</style>
</head>
<body>
<div class="logo">⚔ SPARTAN ROLEPLAY ⚔</div>
<h1>Trailer Oficial 2024</h1>
<p class="sub">FiveM · GTA RP · Brasil</p>
<div class="vwrap">
  <video controls preload="metadata">
    <source src="/spartan_roleplay_v3.mp4" type="video/mp4"/>
  </video>
</div>
<div class="row">
  <a class="btn btn-dl" href="/spartan_roleplay_v3.mp4" download="spartan_roleplay_trailer.mp4">⬇ Baixar (32 MB)</a>
  <a class="btn btn-gh" href="https://github.com/arthurbarros700-cpu/Test-mobile-Cursor" target="_blank">GitHub →</a>
</div>
<div class="specs">
  <span class="spec">1920 × 1080 Full HD</span>
  <span class="spec">H.264 · AAC</span>
  <span class="spec">90 segundos</span>
  <span class="spec">Dark Trap · Sem Narração</span>
  <span class="spec">Efeitos Cinematográficos</span>
</div>
<p class="note">Clique ▶ para assistir ou ⬇ para baixar no PC.</p>

</html>
